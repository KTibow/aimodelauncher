# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx1536m

# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Suppress warnings about old source/target (using Java toolchain instead)
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Use a compatible JDK for running Gradle (JDK 21 installed in the devcontainer)
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

# Let Gradle auto-detect/install toolchains where possible
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
